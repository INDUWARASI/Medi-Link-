<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medi-Link – Caregiver Reminders</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ========== NOTIFICATION TOAST ========== -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- ========== LANDING / ROLE SELECT ========== -->
  <div id="screen-landing" class="screen active">
    <div class="landing-card">
      <div class="logo">
        <span class="logo-icon">💊</span>
        <h1>Medi-Link</h1>
        <p class="tagline">Connecting caregivers and patients</p>
      </div>
      <h2>Sign in as</h2>
      <div class="role-buttons">
        <button class="btn btn-primary" onclick="App.selectRole('caregiver')">
          <span class="btn-icon">👩‍⚕️</span>
          Caregiver
        </button>
        <button class="btn btn-secondary" onclick="App.selectRole('patient')">
          <span class="btn-icon">🧑‍🦽</span>
          Patient
        </button>
      </div>
    </div>
  </div>

  <!-- ========== CAREGIVER DASHBOARD ========== -->
  <div id="screen-caregiver" class="screen">
    <nav class="topbar">
      <div class="topbar-brand">
        <span class="logo-icon">💊</span>
        <span>Medi-Link</span>
      </div>
      <div class="topbar-actions">
        <span class="badge-role caregiver">Caregiver</span>
        <button class="btn btn-outline btn-sm" onclick="App.logout()">Logout</button>
      </div>
    </nav>

    <main class="container">
      <div class="dashboard-header">
        <h2>Patient Reminders</h2>
        <button class="btn btn-primary" onclick="App.openAddReminderModal()">
          + Add Reminder
        </button>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <label for="filter-patient">Patient:</label>
        <select id="filter-patient" onchange="App.applyFilters()">
          <option value="">All patients</option>
        </select>

        <label for="filter-type">Type:</label>
        <select id="filter-type" onchange="App.applyFilters()">
          <option value="">All types</option>
          <option value="medication">Medication</option>
          <option value="appointment">Appointment</option>
          <option value="exercise">Exercise</option>
          <option value="other">Other</option>
        </select>

        <label for="filter-status">Status:</label>
        <select id="filter-status" onchange="App.applyFilters()">
          <option value="">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
        </select>
      </div>

      <!-- Reminders Table -->
      <div id="caregiver-reminders-list" class="reminders-grid">
        <!-- populated by JS -->
      </div>

      <!-- Patients Panel -->
      <div class="section-header">
        <h3>Manage Patients</h3>
        <button class="btn btn-outline btn-sm" onclick="App.openAddPatientModal()">+ Add Patient</button>
      </div>
      <div id="patients-list" class="patients-grid">
        <!-- populated by JS -->
      </div>
    </main>
  </div>

  <!-- ========== PATIENT DASHBOARD ========== -->
  <div id="screen-patient" class="screen">
    <nav class="topbar">
      <div class="topbar-brand">
        <span class="logo-icon">💊</span>
        <span>Medi-Link</span>
      </div>
      <div class="topbar-actions">
        <span class="badge-role patient">Patient</span>
        <button class="btn btn-outline btn-sm" onclick="App.logout()">Logout</button>
      </div>
    </nav>

    <main class="container">
      <div class="dashboard-header">
        <h2>My Reminders</h2>
        <select id="patient-selector" class="patient-select" onchange="App.switchPatient()">
          <!-- populated by JS -->
        </select>
      </div>

      <!-- Summary Cards -->
      <div id="patient-summary" class="summary-cards">
        <!-- populated by JS -->
      </div>

      <!-- Upcoming -->
      <h3 class="section-label">Upcoming Reminders</h3>
      <div id="patient-reminders-upcoming" class="reminders-grid">
        <!-- populated by JS -->
      </div>

      <!-- Past -->
      <h3 class="section-label past-label">Past Reminders</h3>
      <div id="patient-reminders-past" class="reminders-grid">
        <!-- populated by JS -->
      </div>
    </main>
  </div>

  <!-- ========== MODAL: Add / Edit Reminder ========== -->
  <div id="modal-reminder" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-reminder-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-reminder-title">Add Reminder</h3>
        <button class="modal-close" aria-label="Close" onclick="App.closeModal('modal-reminder')">✕</button>
      </div>
      <form id="form-reminder" onsubmit="App.saveReminder(event)">
        <div class="form-group">
          <label for="r-patient">Patient <span class="required">*</span></label>
          <select id="r-patient" required>
            <option value="">Select patient…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="r-title">Title <span class="required">*</span></label>
          <input type="text" id="r-title" placeholder="e.g. Take blood pressure medication" required maxlength="120" />
        </div>
        <div class="form-group">
          <label for="r-type">Type <span class="required">*</span></label>
          <select id="r-type" required>
            <option value="">Select type…</option>
            <option value="medication">💊 Medication</option>
            <option value="appointment">🏥 Appointment</option>
            <option value="exercise">🏃 Exercise</option>
            <option value="other">📌 Other</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="r-date">Date <span class="required">*</span></label>
            <input type="date" id="r-date" required />
          </div>
          <div class="form-group">
            <label for="r-time">Time <span class="required">*</span></label>
            <input type="time" id="r-time" required />
          </div>
        </div>
        <div class="form-group">
          <label for="r-notes">Notes</label>
          <textarea id="r-notes" rows="3" placeholder="Optional notes…" maxlength="500"></textarea>
        </div>
        <input type="hidden" id="r-id" />
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="App.closeModal('modal-reminder')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Reminder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL: Add Patient ========== -->
  <div id="modal-patient" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-patient-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-patient-title">Add Patient</h3>
        <button class="modal-close" aria-label="Close" onclick="App.closeModal('modal-patient')">✕</button>
      </div>
      <form id="form-patient" onsubmit="App.savePatient(event)">
        <div class="form-group">
          <label for="p-name">Full Name <span class="required">*</span></label>
          <input type="text" id="p-name" placeholder="e.g. John Doe" required maxlength="80" />
        </div>
        <div class="form-group">
          <label for="p-age">Age</label>
          <input type="number" id="p-age" min="1" max="130" placeholder="e.g. 65" />
        </div>
        <div class="form-group">
          <label for="p-condition">Primary Condition</label>
          <input type="text" id="p-condition" placeholder="e.g. Hypertension" maxlength="100" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="App.closeModal('modal-patient')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Patient</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL: Confirm Delete ========== -->
  <div id="modal-confirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 id="modal-confirm-title">Delete Reminder</h3>
        <button class="modal-close" aria-label="Close" onclick="App.closeModal('modal-confirm')">✕</button>
      </div>
      <p id="modal-confirm-text" class="modal-body-text">Are you sure you want to delete this reminder?</p>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="App.closeModal('modal-confirm')">Cancel</button>
        <button id="btn-confirm-delete" class="btn btn-danger" onclick="App.confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
